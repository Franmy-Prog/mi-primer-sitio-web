<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi primer sitio web</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            color: #222;
        }

        header {
            background: #24292f;
            color: white;
            text-align: center;
            padding: 40px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 40px;
        }

        header p {
            font-size: 18px;
        }

        main {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        .tarjeta {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .boton {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #e91e63;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .boton:hover {
            background: #0550ae;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #666;
        }
    </style>
</head>

<body>

    <header>
        <h1>¡Hola! 👋</h1>
        <p>Bienvenido a mi primer sitio web</p>
    </header>

    <main>
        <div class="tarjeta">
            <h2>Estoy aprendiendo programación 🚀</h2>

            <p>
                Esta página fue creada con HTML y CSS
                y publicada utilizando GitHub Pages.
            </p>

            <button class="boton" onclick="cambiarMensaje()">
                Haz clic aquí
            </button>
            
            <p id="mensaje"></p>

        </div>
    </main>

    <footer>
        Mi primer proyecto web © 2026
    </footer>

    <script>
    function cambiarMensaje() {
    document.getElementById("mensaje").textContent =
        "¡Lo lograste! 🚀 JavaScript cambió esta página.";
                              }
    </script>

</body>
</html>
